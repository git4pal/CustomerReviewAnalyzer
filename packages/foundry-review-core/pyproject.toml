[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "foundry-review-core"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "azure-ai-projects>=2.3.0,<3",
    "azure-identity>=1.25.0,<2",
    "openai>=2,<3",
    "pydantic>=2.12,<3",
    "python-dotenv>=1.1,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/foundry_review_core"]