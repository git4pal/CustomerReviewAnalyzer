[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brand-compliance-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["foundry-review-core"]

[project.scripts]
brand-compliance-agent = "brand_compliance_agent:main"

[tool.hatch.build.targets.wheel]
packages = ["src/brand_compliance_agent"]