[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentiment-analysis-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["foundry-review-core"]

[project.scripts]
sentiment-analysis-agent = "sentiment_analysis_agent:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sentiment_analysis_agent"]